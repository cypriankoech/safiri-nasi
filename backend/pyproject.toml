[project]
name = "safiri-nasi-api"
version = "0.1.0"
description = "Safiri Nasi Tour & Travel booking API"
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.1",
    "apscheduler>=3.11.3",
    "asyncpg>=0.32.0",
    "bcrypt>=5.0.0",
    "defusedxml>=0.7.1",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.33",
    "python-slugify>=9.1.3",
    "sqlalchemy[asyncio]>=2.1.8",
    "weasyprint>=70.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]
