<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background:#FBF6EC;font-family:Helvetica,Arial,sans-serif;color:#22261F;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#FBF6EC;padding:24px 12px;">
  <tr><td align="center">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;background:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #EFE6D2;">
      <tr><td style="background:#1E3B1C;padding:20px 28px;">
        <span style="color:#F29F1D;font-size:22px;font-weight:800;letter-spacing:.5px;">SAFIRI NASI</span>
        <span style="color:#C9E7A9;font-size:12px;display:block;letter-spacing:2px;">TOUR &amp; TRAVEL</span>
      </td></tr>
      <tr><td style="padding:28px;font-size:15px;line-height:1.6;">
        {% block content %}{% endblock %}
      </td></tr>
      <tr><td style="background:#F6EFDF;padding:18px 28px;font-size:12px;color:#5E6455;line-height:1.5;">
        {{ site.company_name }} · {{ site.address }}<br>
        {{ site.phone }} · <a href="mailto:{{ site.email }}" style="color:#1E3B1C;">{{ site.email }}</a>
        {% if site.whatsapp %} · <a href="https://wa.me/{{ site.whatsapp }}" style="color:#1E3B1C;">WhatsApp us</a>{% endif %}
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
