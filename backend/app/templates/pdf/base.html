<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @page { size: A4; margin: 18mm 16mm 20mm; @bottom-center { content: "{{ (site.company_name ~ " · " ~ site.phone ~ " · " ~ site.email)|replace('"', '')|replace('\\', '')|safe }}"; font-size: 8pt; color: #7a8070; } }
  * { box-sizing: border-box; }
  body { font-family: "DejaVu Sans", Helvetica, Arial, sans-serif; font-size: 10pt; color: #22261F; }
  .head { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 3px solid #7DC242; padding-bottom: 10px; margin-bottom: 18px; }
  .head img { height: 70px; }
  .doc-title { text-align: right; }
  .doc-title h1 { margin: 0; color: #1E3B1C; font-size: 20pt; letter-spacing: 1px; }
  .doc-title .ref { color: #7A2A2A; font-weight: bold; font-size: 11pt; }
  .muted { color: #6b7163; }
  .grid { display: flex; gap: 16px; margin-bottom: 16px; }
  .card { flex: 1; background: #FBF6EC; border-radius: 8px; padding: 10px 12px; }
  .card h3 { margin: 0 0 6px; font-size: 9pt; text-transform: uppercase; letter-spacing: 1px; color: #8F8F1E; }
  table.items { width: 100%; border-collapse: collapse; margin: 8px 0 14px; }
  table.items th { text-align: left; background: #1E3B1C; color: #fff; padding: 7px 8px; font-size: 9pt; }
  table.items td { padding: 7px 8px; border-bottom: 1px solid #EFE6D2; }
  .num { text-align: right; white-space: nowrap; }
  .totals { margin-left: auto; width: 55%; }
  .totals td { padding: 4px 8px; }
  .totals .grand td { font-weight: bold; font-size: 12pt; border-top: 2px solid #1E3B1C; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 9pt; font-weight: bold; background: #E6F4D7; color: #2F6B16; }
  .badge.warn { background: #FDEFD6; color: #8A5300; }
  .note { font-size: 9pt; color: #5E6455; margin-top: 14px; }
  h2 { color: #1E3B1C; font-size: 12pt; margin: 18px 0 6px; }
</style></head>
<body>
<div class="head">
  <img src="logo.png" alt="Safiri Nasi">
  <div class="doc-title"><h1>{% block title %}{% endblock %}</h1><div class="ref">{% block ref %}{% endblock %}</div><div class="muted">Issued {{ issued }}</div></div>
</div>
{% block content %}{% endblock %}
</body></html>
