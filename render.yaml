# Render Blueprint: API + PostgreSQL for a preview/staging deployment.
# Render dashboard → New → Blueprint → pick this repo. See docs/deploy-preview.md.
services:
  - type: web
    name: safirinasitourstravel-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free            # free instances sleep after 15 min idle; "starter" stays awake
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: safirinasitourstravel-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: CALLBACK_SECRET
        generateValue: true
      - key: PAYMENTS_MODE
        value: mock         # simulated payments until provider accounts are ready
      - key: COOKIE_SECURE
        value: "true"
      - key: SEND_EMAILS
        value: "false"      # set SMTP_* and change to true to send real emails
      - key: SEED_ON_START
        value: "true"       # loads tours + demo bookings into the empty database on first boot
      - key: SEED_ADMIN_PASSWORD
        generateValue: true # your admin password: copy it from the Render dashboard
      # Fill these in once Vercel gives you the site's address:
      - key: FRONTEND_URL
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: safirinasitourstravel-db
    plan: free              # free Postgres expires after 30 days; fine for a preview
    region: frankfurt
    postgresMajorVersion: "16"
